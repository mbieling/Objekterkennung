# docker-compose.yml
# Produktions-Stack für Bauteil-Finder (Traefik-Deployment)
# Startet: Next.js App + Python Worker (FastAPI + Celery) + Redis
#
# Verwendung:
#   docker compose up -d          # Alle Services starten
#   docker compose logs -f app    # Next.js Logs
#   docker compose logs -f worker # Worker-Logs
#   docker compose down
#
# Voraussetzungen:
#   - .env muss DATABASE_URL, AWS_* und WORKER_URL=http://worker:8000 enthalten
#   - worker/.env muss DATABASE_URL und AWS_* Variablen enthalten
#   - Traefik proxy-Netzwerk muss existieren: docker network create proxy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: objekterkennung
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.objekterkennung.rule=Host(`objekt.bielingserver.de`)"
      - "traefik.http.routers.objekterkennung.entrypoints=websecure"
      - "traefik.http.routers.objekterkennung.tls=true"
      - "traefik.http.routers.objekterkennung.tls.certresolver=tls_resolver"
      - "traefik.http.routers.objekterkennung.service=objekterkennung"
      - "traefik.http.services.objekterkennung.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.objekterkennung.middlewares=default@file"
    depends_on:
      worker:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: objekterkennung-worker
    restart: unless-stopped
    command: >
      sh -c "rm -f /tmp/.X99-lock &&
             Xvfb :99 -screen 0 512x512x24 -ac +extension GLX -noreset &
             sleep 1 &&
             DISPLAY=:99 uvicorn worker.main:app --host 0.0.0.0 --port 8000 &
             DISPLAY=:99 celery -A worker.tasks worker --loglevel=info --concurrency=1 --pool=solo"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_HOME=/app/model_cache
      - DISPLAY=:99
    env_file:
      - worker/.env
    volumes:
      - model_cache:/app/model_cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
  proxy:
    external: true

volumes:
  model_cache:
